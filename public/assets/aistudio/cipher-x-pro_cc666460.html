<html lang="ar" dir="rtl">
<head>

<title>CIPHER X PRO — إشارات Binance Futures</title>

<style>
:root{
  --bg-void:#020408;--bg-deep:#050d14;--bg-surface:#0a1628;--bg-card:#0d1e35;--bg-elev:#112240;
  --cyan:#00f5ff;--green:#00ff88;--red:#ff2d55;--orange:#ff6b00;--purple:#bf00ff;--gold:#ffd700;--blue:#0080ff;
  --tx:#e8f4ff;--tx2:#7a9bbf;--tx3:#456684;--bd:rgba(0,245,255,.10);--bd2:rgba(0,245,255,.28);
  --up:#00ff88;--dn:#ff2d55;
  --f-ar:'Tajawal','Segoe UI',Tahoma,sans-serif;--f-ui:'Rajdhani','Tajawal',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--f-disp:'Orbitron','Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg-void);color:var(--tx);font-family:var(--f-ar);font-size:14px;line-height:1.5;overscroll-behavior-y:none}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,rgba(0,128,255,.10),transparent 60%),radial-gradient(900px 500px at 0% 10%,rgba(191,0,255,.07),transparent 60%),var(--bg-void)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:var(--f-mono);font-size:14px;color:var(--tx);background:var(--bg-surface);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%;outline:none;direction:ltr;text-align:left}
input:focus,select:focus{border-color:var(--bd2)}
select{direction:rtl;text-align:right}
.num,.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.pos{color:var(--up)}.neg{color:var(--dn)}.mut{color:var(--tx2)}.dim{color:var(--tx3)}.gold{color:var(--gold)}.cy{color:var(--cyan)}
.app{max-width:1180px;margin:0 auto;padding:0 12px 92px}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;margin:0 -12px;padding:10px 14px;background:linear-gradient(180deg,rgba(2,4,8,.97),rgba(2,4,8,.88));backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-disp);font-weight:900;letter-spacing:2px;font-size:15px;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.brand small{font-size:9px;letter-spacing:1px;color:var(--gold);-webkit-text-fill-color:var(--gold);margin-inline-start:4px}
.top .sp{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);display:inline-block;margin-inline-end:4px}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.warn{background:var(--orange)}.dot.bad{background:var(--red)}
.stat{font-size:11px;color:var(--tx2);display:flex;align-items:center;white-space:nowrap}
.modebtn{font-size:12px;padding:5px 10px;border:1px solid var(--bd2);border-radius:999px;color:var(--cyan)}
.progress{height:2px;background:transparent;position:absolute;left:0;right:0;bottom:-1px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .3s}
/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;background:rgba(3,8,14,.96);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.nav .in{display:flex;width:100%;max-width:640px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;color:var(--tx3);border-radius:10px;position:relative}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--cyan)}
.nav button.on::after{content:"";position:absolute;top:-5px;left:30%;right:30%;height:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);border-radius:2px}
.nav .badge{position:absolute;top:2px;inset-inline-end:22%;background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono)}
/* ---------- primitives ---------- */
.page{display:none;padding-top:12px;animation:fade .25s}.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,rgba(13,30,53,.92),rgba(10,22,40,.92));border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;position:relative}
.card h3{font-size:13px;font-weight:700;color:var(--cyan);letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sub{margin-inline-start:auto;font-weight:400;font-size:11px;color:var(--tx3)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
.row{display:flex;align-items:center;gap:8px}.row.sb{justify-content:space-between}.wrap{flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed rgba(122,155,191,.12);font-size:13px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--tx2)}
.tile{background:var(--bg-surface);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
.tile .l{font-size:10px;color:var(--tx3);letter-spacing:.4px}.tile .v{font-family:var(--f-mono);font-size:16px;font-weight:500;margin-top:2px;direction:ltr;text-align:right}
.badge2,.b{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;font-family:var(--f-ui);letter-spacing:.5px;direction:ltr}
.b-long{background:rgba(0,255,136,.12);color:var(--green);border:1px solid rgba(0,255,136,.35)}
.b-short{background:rgba(255,45,85,.12);color:var(--red);border:1px solid rgba(255,45,85,.35)}
.b-strong{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.4)}

.b-watch{background:rgba(122,155,191,.10);color:var(--tx2);border:1px solid rgba(122,155,191,.25)}
.b-open{background:rgba(0,255,136,.1);color:var(--green)}.b-pend{background:rgba(255,107,0,.12);color:var(--orange)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--bd2);color:var(--cyan);font-weight:700;font-size:13px;background:rgba(0,245,255,.05)}

.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}.btn.red{border-color:rgba(255,45,85,.45);color:var(--red);background:rgba(255,45,85,.06)}
.btn[disabled]{opacity:.45;pointer-events:none}

.seg button{flex:1;padding:6px 10px;font-size:12px;border-radius:7px;color:var(--tx2);white-space:nowrap;font-family:var(--f-ui);font-weight:600}
.seg button.on{background:rgba(0,245,255,.16);color:var(--cyan)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--bd);color:var(--tx2);font-size:12px;white-space:nowrap}.chip.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,245,255,.08)}
.bar{height:6px;background:rgba(122,155,191,.15);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.ring{--v:0;--c:var(--cyan);width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(122,155,191,.18) 0);display:grid;place-items:center;flex:none}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--bg-card);display:grid;place-items:center;font-family:var(--f-mono);font-size:15px}
.empty{text-align:center;color:var(--tx2);padding:26px 14px;font-size:13px;line-height:1.9}
.hint{font-size:11.5px;color:var(--tx3);line-height:1.7}
details{border-top:1px solid var(--bd);margin-top:8px;padding-top:8px}details summary{cursor:pointer;font-size:12.5px;color:var(--cyan);font-weight:700;list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}details summary::before{content:"▸";font-size:10px;transition:transform .2s}details[open] summary::before{transform:rotate(90deg)}
/* ---------- signal card ---------- */
.sig{border-inline-start:3px solid var(--tx3)}.sig.long{border-inline-start-color:var(--green)}.sig.short{border-inline-start-color:var(--red)}

.sig .sym{font-family:var(--f-ui);font-weight:700;font-size:19px;letter-spacing:.5px;direction:ltr}
.ladder{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.lv{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--bd);font-size:13px}
.lv .n{width:56px;color:var(--tx2);font-size:11.5px;font-weight:700}.lv .p{font-family:var(--f-mono);font-weight:500;flex:1;direction:ltr;text-align:left}.lv .r{font-family:var(--f-mono);font-size:11.5px;color:var(--tx2);direction:ltr}
.lv.entry{border-color:var(--cyan);background:rgba(0,245,255,.07)}.lv.sl{border-color:rgba(255,45,85,.4)}.lv.sl .p{color:var(--red)}.lv.tp .p{color:var(--green)}.lv.tp.hit{opacity:.55;text-decoration:line-through}
.lv.now{border-style:dashed;border-color:var(--gold)}.lv.now .p{color:var(--gold)}

.ok{color:var(--green)}.no{color:var(--red)}.nt{color:var(--gold)}

.part{margin:7px 0}.part .ph{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}.part .pd{font-size:11.5px;color:var(--tx3);margin-top:2px}

.mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--tx3)}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-weight:600;color:var(--tx3);font-size:11px;padding:6px 8px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}

.chartbox canvas{display:block;width:100%;touch-action:none}
.pricehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.pricehead .px{font-family:var(--f-mono);font-size:26px;font-weight:600;direction:ltr}

/* ---------- depth ---------- */

.dp .rw{position:relative;display:flex;justify-content:space-between;padding:2px 6px;overflow:hidden}
.dp .rw i{position:absolute;top:0;bottom:0;opacity:.22}.dp .rw span{position:relative}
.dp .b i{background:var(--green);right:0}.dp .a i{background:var(--red);left:0}
/* ---------- toasts / overlay ---------- */
.toasts{position:fixed;top:58px;left:10px;right:10px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{pointer-events:auto;max-width:520px;width:100%;background:var(--bg-elev);border:1px solid var(--bd2);border-radius:12px;padding:11px 14px;font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:fade .25s;cursor:pointer}
.toast.long{border-color:var(--green)}.toast.short,.toast.bad{border-color:var(--red)}
.boot{position:fixed;inset:0;z-index:80;background:var(--bg-void);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.boot .logo{font-family:var(--f-disp);font-size:28px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.boot .pb{width:min(360px,80vw);height:4px;background:rgba(122,155,191,.2);border-radius:3px;overflow:hidden}.boot .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .3s}
.boot.hide{display:none}
.sep{height:1px;background:var(--bd);margin:10px 0}
label.f{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(122,155,191,.12);font-size:13px}
.sw{width:42px;height:24px;border-radius:12px;background:rgba(122,155,191,.25);position:relative;transition:.2s;flex:none}.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--cyan)}.sw.on::after{inset-inline-start:21px}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}.pricehead .px{font-size:22px}}
@media (min-width:900px){.app{padding-bottom:100px}.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}}

.candl{display:flex;flex-direction:column}
.cand{padding:10px 4px;border-bottom:1px solid rgba(122,155,191,.1);cursor:pointer}.cand:last-child{border-bottom:0}.cand:active{background:rgba(0,245,255,.05)}
.cand .sym{font-family:var(--f-ui);font-weight:700;letter-spacing:.4px;direction:ltr;display:inline-block}
.cand .cwhy{margin-top:4px;white-space:normal;line-height:1.55}

@media(max-width:480px){.tbl th,.tbl td{padding:8px 4px}.tbl .b{padding:2px 6px;font-size:10px;letter-spacing:0}.tbl{font-size:12px}}
.tbl td.out{white-space:normal;min-width:92px;line-height:1.4}

<script>
/* ===== engine-a ===== */
/* ============================================================
   CIPHER X PRO — ENGINE A : المؤشرات الفنية (Indicators)
   دوال نقية بدون DOM — تعمل في المتصفح وفي Node
   ============================================================ */
var CX = (typeof CX !== 'undefined') ? CX : {};
(function (CX) {
'use strict';

const TF_MS = { '1m': 60e3, '3m': 180e3, '5m': 300e3, '15m': 900e3, '30m': 1800e3, '1h': 3600e3, '2h': 7200e3,
  '4h': 14400e3, '6h': 21600e3, '8h': 28800e3, '12h': 43200e3, '1d': 86400e3, '1w': 604800e3 };
CX.TF_MS = TF_MS;

const isN = Number.isFinite;
const mk = n => { const a = new Float64Array(n); a.fill(NaN); return a; };
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
CX.util = {
  isN, mk, clamp,
  fmtP(p, tick) {                       // تنسيق السعر حسب tickSize
    if (!isN(p)) return '—';
    let d = 2;
    if (tick > 0) { d = Math.max(0, Math.min(10, Math.round(-Math.log10(tick)))); }
    else d = p >= 1000 ? 2 : p >= 10 ? 3 : p >= 1 ? 4 : p >= 0.1 ? 5 : 6;
    return p.toFixed(d);
  },
  roundTick(p, tick, mode) {            // تقريب للسعر إلى tickSize (mode: 'down' | 'up' | 'near')
    if (!(tick > 0)) return p;
    const q = p / tick, r = mode === 'down' ? Math.floor(q + 1e-9) : mode === 'up' ? Math.ceil(q - 1e-9) : Math.round(q);
    const d = Math.max(0, Math.min(10, Math.round(-Math.log10(tick))));
    return +(r * tick).toFixed(d);
  },
};

const ind = CX.ind = {};

/* ---------- المتوسطات ---------- */
ind.sma = (s, n) => {
  const o = mk(s.length); let sum = 0, cnt = 0;
  for (let i = 0; i < s.length; i++) {
    if (isN(s[i])) { sum += s[i]; cnt++; }
    if (i >= n && isN(s[i - n])) { sum -= s[i - n]; cnt--; }
    if (cnt === n) o[i] = sum / n;
  }
  return o;
};

const smooth = (s, n, alpha) => {        // EMA / RMA مبذور بـ SMA (نفس طريقة TradingView)
  const o = mk(s.length);
  let first = -1;
  for (let i = 0; i < s.length; i++) if (isN(s[i])) { first = i; break; }
  if (first < 0 || first + n > s.length) return o;
  let sum = 0;
  for (let i = first; i < first + n; i++) sum += s[i];
  let prev = sum / n; o[first + n - 1] = prev;
  for (let i = first + n; i < s.length; i++) {
    if (!isN(s[i])) { o[i] = prev; continue; }
    prev = prev + alpha * (s[i] - prev); o[i] = prev;
  }
  return o;
};
ind.ema = (s, n) => smooth(s, n, 2 / (n + 1));
ind.rma = (s, n) => smooth(s, n, 1 / n);

/* ---------- RSI (Wilder) ---------- */
ind.rsi = (c, n = 14) => {
  const o = mk(c.length); if (c.length <= n) return o;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; if (d > 0) g += d; else l -= d; }
  g /= n; l /= n;
  const val = () => (g === 0 && l === 0 ? 50 : l === 0 ? 100 : 100 - 100 / (1 + g / l));
  o[n] = val();
  for (let i = n + 1; i < c.length; i++) {
    const d = c[i] - c[i - 1];
    g = (g * (n - 1) + (d > 0 ? d : 0)) / n;
    l = (l * (n - 1) + (d < 0 ? -d : 0)) / n;
    o[i] = val();
  }
  return o;
};

/* ---------- MACD ---------- */
ind.macd = (c, f = 12, s = 26, sg = 9) => {
  const ef = ind.ema(c, f), es = ind.ema(c, s), m = mk(c.length);
  for (let i = 0; i < c.length; i++) if (isN(ef[i]) && isN(es[i])) m[i] = ef[i] - es[i];
  const sig = ind.ema(m, sg), h = mk(c.length);
  for (let i = 0; i < c.length; i++) if (isN(m[i]) && isN(sig[i])) h[i] = m[i] - sig[i];
  return { macd: m, signal: sig, hist: h };
};

/* ---------- ATR / TR ---------- */
ind.tr = (h, l, c) => {
  const o = mk(h.length);

/* ---------- الماسح: تحميل، تحليل، دورات إغلاق الشموع، إشارات، تتبع ---------- */
CX.scan = (() => {
  const state = { phase: 'idle', msg: '', progress: 0, lastCycle: 0, cycles: 0, errors: 0, busy: false, cycleOpen: 0, started: false, geo: false };
  const emit = () => CX.bus.emit('scan-state', state);
  let timers = [];

  const effDeriv = r => {
    let D = r.deriv && Date.now() - r.derivAt < 15 * 60e3 ? Object.assign({}, r.deriv) : null;
    if (isN(r.funding)) { D = D || {}; D.funding = r.funding; D.fundingMs = r.next; if (isN(r.mark) && isN(r.index) && r.index) D.basisBps = 1e4 * (r.mark - r.index) / r.index; }
    if (D) Object.assign(D, CX.deriv.liq15(r.sym));
    return D;
  };
  const effBook = r => { if (!r.book || Date.now() - r.bookAt > 90e3) return null; const b = Object.assign({}, r.book); if (r.bbo && Date.now() - r.bbo.t < 10e3) b.spreadBps = r.bbo.spreadBps; return b; };

  function analyze(sym, force) {
    const r = st.rec(sym); if (!r.ready) return null;
    const tfs = CX.settings.tfs(), cs = {}; let key = '';
    for (const tf of st.roles()) { const a = st.closed(sym, tf); cs[tf] = a; key += tf + ':' + (a.length ? a[a.length - 1].t : 0) + ','; }
    if ((cs[tfs.trigger] || []).length < 120 || (cs[tfs.setup] || []).length < 90 || (cs[tfs.trend] || []).length < 90) { r.err = 'تاريخ غير كافٍ'; r.report = null; return null; }
    let ctx = r.ctx;
    if (force || !ctx || r.ctxKey !== key) { ctx = CX.engine.prepare(cs, tfs, r.meta, CX.settings.engineCfg()); r.ctx = ctx; r.ctxKey = key; }
    ctx.cfg = Object.assign({}, CX.defaults, CX.settings.engineCfg());
    const T = ctx.B.trigger; if (!T) return null;
    const price = isN(r.price) ? r.price : T.c[T.n - 1];
    const R = CX.engine.evaluate(ctx, T.n - 1, { price, deriv: effDeriv(r), book: effBook(r) });
    r.report = R; r.lastAn = Date.now(); r.err = ''; CX.bus.emit('report', sym); return R;
  }

  async function enrich(sym, withBook) {
    const r = st.rec(sym);
    try { const D = await CX.deriv.fetch(sym); if (D) { r.deriv = D; r.derivAt = Date.now(); } } catch (e) {}
    if (withBook) { try { const b = CX.bookCalc(await CX.api.depth(sym, 500)); if (b) { r.book = b; r.bookAt = Date.now(); } } catch (e) {} }
  }

  /* ---- إنشاء إشارة ---- */
  async function considerSignal(sym) {
    const cfg = CX.settings.all(), r = st.rec(sym); let R = r.report;
    if (!R || !R.plan || !R.plan.ok || !(R.tier === 'GOOD' || R.tier === 'STRONG') || RANK[R.tier] < RANK[cfg.minTier]) return;
    const tfs = CX.settings.tfs(), ms = CX.TF_MS[tfs.trigger], mine = CX.signals.all().filter(s => s.sym === sym);
    if (mine.some(isLive)) return;
    const last = mine[mine.length - 1]; if (last && Date.now() - last.t0 < cfg.cooldownBars * ms) return;
    if (CX.api.now() - R.tClose > 2 * ms) return;                          // التحليل قديم
    if (CX.signals.live().length >= 6) return;                              // حد أقصى للإشارات المتزامنة
    let price = r.price;
    try { const p = await CX.api.get('/fapi/v1/ticker/price', { symbol: sym }, { weight: 1, pr: 2 }); price = +p.price; } catch (e) {}
    if (isN(price) && Math.abs(price - R.price) / R.price > 0.0001) {       // تحقق من السعر اللحظي: سعر الدخول = السعر الحالي فعلاً
      r.price = price; r.priceT = Date.now(); R = analyze(sym, false);
      if (!R || !R.plan || !R.plan.ok || RANK[R.tier] < 2) return;
    }
    if (CX.signals.all().some(s => s.sym === sym && isLive(s))) return;
    const plan = R.plan, parts = R.parts.filter(p => Math.sign(p.raw) === R.dir).sort((a, b) => Math.abs(b.raw * b.wEff) - Math.abs(a.raw * a.wEff));
    const sig = CX.bt.newTrade(plan, { sym, t: Date.now(), tier: R.tier, score: R.score, tfMs: ms, id: sym + '-' + R.t + '-' + (plan.long ? 'L' : 'S') });
    sig.lastT = Math.floor(Date.now() / 60000) * 60000;
    Object.assign(sig, { headline: CX.engine.headline(R, sym), grade: R.grade, aligned: R.aligned, mode: cfg.mode, tfs, price0: price, atr: R.atr, riskATR: plan.riskATR,
      rr: [plan.rr1, plan.rr2, plan.rr3], zone: plan.zone, stopRef: plan.stopRef, checks: plan.checks, warnings: plan.warnings, size: plan.size, confirmBits: plan.confirmBits,
      reasons: parts.slice(0, 5).map(p => ({ label: p.label, raw: +p.raw.toFixed(2), detail: p.detail })),
      against: R.parts.filter(p => Math.sign(p.raw) === -R.dir && Math.abs(p.raw) >= 0.3).map(p => ({ label: p.label, detail: p.detail })),
      gates: R.gates, regime: R.regime.type, tick: r.meta.tick, equity: cfg.equity, riskPct: cfg.riskPct, hasDeriv: !!(R.deriv && isN(R.deriv.oiChg4h)) });
    CX.signals.add(sig); CX.bus.emit('signal', sig); CX.notify.onSignal(sig); refreshStreams();
  }

  /* ---- تتبع الإشارات بشموع 1 دقيقة (ترتيب متحفظ: الوقف أولاً) ---- */
  async function trackAll() {
    for (const s of CX.signals.live()) {
      try {
        const before = { status: s.status, hits: s.tps.filter(t => t.hit).length };
        let more = true, guard = 0;
        while (more && guard++ < 6 && isLive(s)) {
          const arr = await CX.api.get('/fapi/v1/klines', { symbol: s.sym, interval: '1m', startTime: s.lastT + 60000, limit: 500 }, { weight: 2, pr: 2 });
          more = arr.length >= 500;
          for (const a of arr) { const k = CX.api.K(a); if (!k.x) { more = false; break; } CX.bt.step(s, k); if (!isLive(s)) break; }
        }
        const hits = s.tps.filter(t => t.hit).length;
        if (before.status === 'PENDING' && s.status !== 'PENDING' && s.status !== 'CANCELLED') CX.notify.onEvent(s, 'FILLED');
        for (let k = before.hits + 1; k <= hits && k <= 3; k++) if (!(k === 3 && s.status === 'CLOSED')) CX.notify.onEvent(s, 'TP' + k);
        if (s.status === 'CLOSED' && before.status !== 'CLOSED') CX.notify.onEvent(s, s.outcome === 'TP3' ? 'TP3' : s.outcome === 'SL' ? 'SL' : 'BE');
        if (s.status === 'CANCELLED' && before.status !== 'CANCELLED') CX.notify.onEvent(s, s.outcome);
        if (s.status !== before.status || hits !== before.hits) { CX.signals.save(); CX.bus.emit('signal-update', s); refreshStreams(); }
      } catch (e) {}
    }

  }

  function refreshStreams() { st.syncStreams(CX.signals.live().map(s => s.sym)); }

  async function cycle() {
    if (state.busy || state.phase !== 'ready') return; state.busy = true; emit();

      const uni = S.universe;
      await Promise.all(uni.map(sym => st.ensureFresh(sym)));
      for (const sym of uni) analyze(sym, false);
      const cands = uni.map(s => st.rec(s)).filter(r => r.report && r.report.dir && r.report.rawScore >= 60).sort((a, b) => b.report.score - a.report.score).slice(0, 8);
      for (const r of cands) { if (Date.now() - r.derivAt > 90e3) await enrich(r.sym, true); analyze(r.sym, false); }
      if (CX.settings.get('autoScan')) for (const sym of uni) await considerSignal(sym);
      state.lastCycle = Date.now(); state.cycles++;
    } catch (e) { state.errors++; state.msg = String(e.message || e); console.error(e); }
    state.busy = false; emit(); CX.bus.emit('cycle');
  }

  async function boot() {
    state.phase = 'boot'; state.msg = 'مزامنة الوقت…'; state.progress = 0.02; state.geo = false; emit();
    try {
      await CX.api.syncTime();
      state.msg = 'تحميل عقود Binance Futures…'; emit();
      S.meta = await CX.api.exchangeInfo();
      const tk = await CX.api.tickers();
      let pm = {}; try { pm = await CX.api.premium(); } catch (e) {}
      const c = CX.settings.all(), favs = c.favorites.filter(s => S.meta[s]), minVol = c.minVolM * 1e6, old = Date.now() - 45 * 86400e3;
      const ranked = Object.keys(S.meta).filter(s => tk[s] && tk[s].vol >= minVol && (S.meta[s].onboard || 0) < old).sort((a, b) => tk[b].vol - tk[a].vol);
      S.universe = [...new Set([...favs, ...ranked])].slice(0, Math.max(c.universe, favs.length));
      for (const sym of Object.keys(tk)) { if (!S.meta[sym]) continue; const r = st.rec(sym); r.meta = S.meta[sym]; Object.assign(r, { price: tk[sym].price, priceT: Date.now(), chg: tk[sym].chg, vol: tk[sym].vol, hi: tk[sym].hi, lo: tk[sym].lo });
        if (pm[sym]) Object.assign(r, { mark: pm[sym].mark, index: pm[sym].index, funding: pm[sym].funding, next: pm[sym].next }); }
      let done = 0;
      state.msg = 'تحميل الشموع متعددة الأطر…'; emit();
      await Promise.all(S.universe.map(async (sym, k) => { await st.loadSymbol(sym, k < 4 ? 2 : 5); done++; state.progress = 0.1 + 0.8 * done / S.universe.length; state.msg = `تحميل الشموع ${done}/${S.universe.length}`; emit(); }));
      const ok = S.universe.filter(s => st.rec(s).ready);
      if (!ok.length) throw new Error(CX.api.st.geo ? 'GEO_BLOCK' : (CX.api.st.lastErr || 'تعذر تحميل أي رمز'));
      S.universe = ok;
      if (!S.active || !ok.includes(S.active)) S.active = ok[0];
      state.msg = 'تحليل أولي…'; emit();
      for (const sym of S.universe) analyze(sym, true);
      state.phase = 'ready'; state.progress = 1; state.msg = ''; state.cycleOpen = Math.floor(CX.api.now() / CX.TF_MS[CX.settings.tfs().trigger]); emit();
      refreshStreams(); CX.bus.emit('boot-done');

      startTimers();
    } catch (e) {

    every(() => {                                           // دورة عند إغلاق كل شمعة محفّز
      const cur = Math.floor(CX.api.now() / CX.TF_MS[CX.settings.tfs().trigger]);
      if (cur !== state.cycleOpen) { state.cycleOpen = cur; setTimeout(cycle, 2500); }
    }, 1000);
    every(async () => {                                      // أسعار + تمويل لكل الرموز (REST) — يغني عن WS للباقي
      try { const pm = await CX.api.premium(); for (const sym of S.universe) { const r = st.rec(sym), p = pm[sym]; if (!p) continue;
        if (!r.markT || Date.now() - r.markT > 5000) Object.assign(r, { mark: p.mark, index: p.index, funding: p.funding, next: p.next });
        if (Date.now() - r.priceT > 12000) { r.price = p.mark; r.priceT = Date.now(); } } CX.bus.emit('prices'); } catch (e) {}
    }, 10000);
    every(async () => { try { const tk = await CX.api.tickers(); for (const sym of S.universe) { const r = st.rec(sym), t = tk[sym]; if (t) Object.assign(r, { chg: t.chg, vol: t.vol, hi: t.hi, lo: t.lo }); } } catch (e) {} }, 60000);
    every(() => { if (S.active) analyze(S.active, false); }, 4000);          // تحديث التقييم بالسعر الحي للرمز النشط
    every(async () => { if (S.active) { await enrich(S.active, true); analyze(S.active, false); } }, 25000);
    every(trackAll, 15000);
    every(() => { if (!CX.feed.healthy() && S.phase !== 'idle') { /* WS غير متاح: REST يعوّض */ } }, 30000);
  }

  CX.bus.on('bar-close', ({ sym }) => { if (state.phase === 'ready' && sym === S.active) setTimeout(() => analyze(sym, false), 300); });

  return {
    state, analyze, enrich, boot, cycle, trackAll, refreshStreams,
    setActive(sym) { S.active = sym; refreshStreams(); const r = st.rec(sym); if (!r.ready) st.loadSymbol(sym, 1).then(() => { analyze(sym, true); }); else analyze(sym, false); enrich(sym, true).then(() => analyze(sym, false)); CX.bus.emit('active', sym); },
    async reboot() { timers.forEach(clearInterval); timers = []; for (const k of Object.keys(S.recs)) { const r = S.recs[k]; r.candles = {}; r.ready = false; r.report = null; r.ctx = null; r.ctxKey = ''; } await boot(); },
    async backtest(sym, days, onProg) {
      const tfs = CX.settings.tfs(), ms = CX.TF_MS, cs = {}, roles = [['trigger', days * 86400e3 / ms[tfs.trigger]], ['setup', days * 86400e3 / ms[tfs.setup] + 260], ['trend', days * 86400e3 / ms[tfs.trend] + 260]];
      if (tfs.htf) roles.push(['htf', days * 86400e3 / ms[tfs.htf] + 30]);
      let k = 0; const nn = roles.length;
      for (const [role, want] of roles) {
        const tf = tfs[role], bars = Math.min(20000, Math.ceil(want));
        const arr = await CX.api.klinesLong(sym, tf, bars, p => onProg && onProg((k + p) / nn * 0.6));
        cs[tf] = arr.filter(c => c.x !== false); k++;
      }
      const meta = st.rec(sym).meta || {};
      return CX.bt.run(cs, tfs, meta, CX.settings.engineCfg(), { sym, onProgress: p => onProg && onProg(0.6 + 0.4 * p) });
    },
  };
})();

        <select id="btDays" style="max-width:130px">${[14, 30, 60, 90, 120].map(d => `<option value="${d}" ${(R ? R.days : 60) === d ? 'selected' : ''}>${d} يوم</option>`).join('')}</select>

        <div class="bar" style="margin-top:10px;display:${btRunning ? 'block' : 'none'}"><i id="btBar" style="width:0;background:var(--cyan)"></i></div>
        <div class="hint" style="margin-top:8px">الافتراضات: رسوم Taker ${(CX.settings.get('takerFee') * 100).toFixed(3)}% + انزلاق ${(CX.settings.get('slip') * 100).toFixed(3)}% · عند تداخل الوقف والهدف داخل شمعة يُحتسب الوقف أولاً · لا مشتقات ولا دفتر أوامر تاريخياً (تُختبر عوامل السعر والتدفق فقط) · صفقة واحدة لكل رمز · أنماط الماضي لا تضمن المستقبل.</div></div>
        ${R ? `<div class="card"><h3>نتيجة ${U.short(R.sym)} — ${R.days} يوماً<span class="sub">${R.res.bars} شمعة · ${R.res.evals} تقييم · ${(R.res.ms / 1000).toFixed(1)}ث</span></h3>${statsHtml(R.res.trades, '')}${tradesTbl(R.res.trades, true)}</div>` : '<div class="card empty">اختر رمزاً وفترة ثم شغّل الاختبار لترى كيف كان المحرك سيتصرف على بيانات حقيقية، بما فيها الخسائر.</div>'}`;
    }
    root.innerHTML = `<div class="seg" style="margin-bottom:12px"><button class="${tab === 'live' ? 'on' : ''}" data-pt="live">الإشارات الفعلية</button><button class="${tab === 'bt' ? 'on' : ''}" data-pt="bt">الباكتيست</button></div>${body}`;
  },
};
document.addEventListener('click', async e => {
  const pt = e.target.closest('[data-pt]'); if (pt) { U.perfTab = pt.dataset.pt; U.pages.perf.render(); return; }
  if (e.target.id === 'clrSig' && confirm('مسح كل سجل الإشارات؟')) { CX.signals.clear(); U.pages.perf.render(); }
  if (e.target.id === 'btRun' && !btRunning) {
    const sym = $('#btSym').value, days = +$('#btDays').value; btRunning = true; U.pages.perf.render();
    try { const res = await CX.scan.backtest(sym, days, p => { const b = $('#btBar'); if (b) b.style.width = (p * 100).toFixed(0) + '%'; }); U.btRes = { sym, days, res }; }
    catch (err) { U.toast('فشل الباكتيست: ' + esc(err.message || err), 'bad'); }
    btRunning = false; U.pages.perf.render();
  }
});

/* ---------- الإعدادات ---------- */
let setBuilt = false;
const num = (id, k, f) => { const el = $('#' + id); el.onchange = () => { const v = parseFloat(el.value); if (isFinite(v)) CX.settings.set({ [k]: f ? f(v) : v }); }; };
function buildSettings() {
  const c = CX.settings.all(), root = $('#p-settings');
  const tog = (k, l) => `<div class="tog"><span>${l}</span><div class="sw ${c[k] ? 'on' : ''}" data-t="${k}"></div></div>`;
  const inp = (id, l, v, extra) => `<label class="f" for="${id}">${l}</label><input id="${id}" inputmode="decimal" value="${esc(v)}" ${extra || ''}>`;
  root.innerHTML = `
  <div class="card"><h3>نمط التداول والأطر الزمنية</h3><div class="seg" id="setMode">${Object.entries(CX.modes).map(([k, m]) => `<button data-m="${k}" class="${c.mode === k ? 'on' : ''}">${m.label}</button>`).join('')}</div>
    <div class="hint" id="modeHint" style="margin-top:8px"></div></div>
  <div class="card"><h3>المخاطر وحجم المركز</h3><div class="grid g2">${inp('sEq', 'رأس المال (USDT)', c.equity)}${inp('sRisk', 'المخاطرة لكل صفقة %', c.riskPct)}${inp('sLev', 'أقصى رافعة', c.maxLev)}${inp('sFee', 'رسوم Taker %', (c.takerFee * 100).toFixed(3))}${inp('sMk', 'رسوم Maker %', (c.makerFee * 100).toFixed(3))}${inp('sSlip', 'انزلاق % (افتراضي)', (c.slip * 100).toFixed(3))}</div>
    <div class="hint" style="margin-top:8px">الرافعة المقترحة تُحسب من مسافة الوقف: لا تتجاوز الرافعة الآمنة التي تبقي سعر التصفية أبعد من الوقف بـ1.5 ضعف. الأحجام تلتزم بفلاتر Binance (stepSize/minQty/minNotional) لكل عقد.</div></div>
  <div class="card"><h3>إصدار الإشارات</h3><label class="f">أدنى مستوى للإشعار والإصدار</label><div class="seg" id="setTier"><button data-v="GOOD" class="${c.minTier === 'GOOD' ? 'on' : ''}">GOOD وأعلى</button><button data-v="STRONG" class="${c.minTier === 'STRONG' ? 'on' : ''}">STRONG فقط</button></div>
    <div class="grid g3">${inp('sMin', 'حد GOOD', c.minScore)}${inp('sStr', 'حد STRONG', c.strongScore)}${inp('sWat', 'حد المراقبة', c.watchScore)}</div>${tog('autoScan', 'إصدار الإشارات تلقائياً عند كل إغلاق شمعة')}</div>
  <div class="card"><h3>الكون (العملات الممسوحة)</h3><div class="grid g2">${inp('sUni', 'عدد العملات', c.universe)}${inp('sVol', 'أدنى حجم 24س (مليون $)', c.minVolM)}</div>${inp('sFav', 'مفضلة دائماً (مفصولة بفاصلة)', c.favorites.join(','), 'style="direction:ltr"')}
    <div style="margin-top:10px"><button class="btn" id="applyUni">تطبيق وإعادة المسح</button></div></div>
  <div class="card"><h3>الإشعارات</h3>${tog('soundOn', 'صوت التنبيه')}${tog('vibrateOn', 'اهتزاز')}${tog('notifyOn', 'إشعارات المتصفح')}${tog('wakeLock', 'إبقاء الشاشة مضاءة (لاستمرار المسح)')}
    <div style="margin-top:10px" class="row wrap"><button class="btn sm" id="askNotif">طلب إذن الإشعارات</button><button class="btn sm" id="testSnd">اختبار الصوت</button></div>
    <div class="hint" style="margin-top:8px">المتصفح لا يعمل في الخلفية: المسح والتنبيهات تتوقف عند إغلاق الصفحة أو قفل الشاشة. لتشغيل 24/7 يلزم خادم (يمكن نقل نفس المحرك إلى Node).</div></div>
  <div class="card"><h3>تيليجرام</h3>${tog('tgOn', 'إرسال الإشارات والأحداث إلى تيليجرام')}${inp('sTok', 'Bot Token (من @BotFather)', c.tgToken, 'type="password" autocomplete="off"')}${inp('sChat', 'Chat ID', c.tgChat)}
    <div style="margin-top:10px" class="row wrap"><button class="btn sm" id="testTg">إرسال رسالة اختبار</button></div>
    <div class="hint" style="margin-top:8px">يُخزَّن التوكن في متصفحك فقط ويُرسل مباشرة إلى api.telegram.org عبر HTTPS (POST). لا تشارك نسخة هذا الملف وهو يحوي توكنك. أنشئ بوتاً مخصصاً لهذا الغرض.</div></div>
  <div class="card"><h3>متقدم</h3>${inp('sApi', 'REST Base', c.apiBase, 'style="direction:ltr"')}${inp('sWs', 'WebSocket Base', c.wsBase, 'style="direction:ltr"')}
    <div class="hint" style="margin-top:6px">المسارات المستخدمة: <span class="num">/fapi/v1/*</span> و <span class="num">/futures/data/*</span>، و WebSocket عبر <span class="num">/market</span> و <span class="num">/public</span> (المسارات القديمة /ws و /stream أُوقفت من Binance). غيّر القيم فقط عند استخدام وسيط.</div>
    <div class="row wrap" style="margin-top:10px"><button class="btn sm" id="applyApi">حفظ وإعادة الاتصال</button><button class="btn sm red" id="resetSet">استعادة الافتراضيات</button></div></div>
  <div class="card"><h3>تشخيص الاتصال</h3><div id="diag"></div></div>
  <div class="card"><h3>تنبيه المخاطر</h3><div class="hint" style="line-height:1.9">هذه أداة تحليل وليست نصيحة مالية. التداول في عقود Futures بالرافعة قد يؤدي لخسارة رأس المال كاملاً. لا يوجد نظام يضمن الربح، والدرجات والتحليلات احتمالية. اختبر دائماً على صفحة «الباكتيست» وتتبّع الأداء الفعلي بمبالغ صغيرة قبل أي توسع. أنت وحدك مسؤول عن قراراتك.</div></div>`;
  num('sEq', 'equity'); num('sRisk', 'riskPct'); num('sLev', 'maxLev'); num('sFee', 'takerFee', v => v / 100); num('sMk', 'makerFee', v => v / 100); num('sSlip', 'slip', v => v / 100);
  num('sMin', 'minScore'); num('sStr', 'strongScore'); num('sWat', 'watchScore'); num('sUni', 'universe'); num('sVol', 'minVolM');
  $('#sFav').onchange = e => CX.settings.set({ favorites: e.target.value.toUpperCase().split(/[\s,]+/).filter(Boolean).map(s => (s.endsWith('USDT') ? s : s + 'USDT')) });
  $('#sTok').onchange = e => CX.settings.set({ tgToken: e.target.value.trim() }); $('#sChat').onchange = e => CX.settings.set({ tgChat: e.target.value.trim() });
  $('#setTier').onclick = e => { const b = e.target.closest('button'); if (!b) return; CX.settings.set({ minTier: b.dataset.v }); U.$$('#setTier button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#setMode').onclick = async e => { const b = e.target.closest('button'); if (!b || b.dataset.m === CX.settings.get('mode')) return; if (!confirm('تغيير النمط يعيد تحميل الشموع للأطر الجديدة. متابعة؟')) return; CX.settings.set({ mode: b.dataset.m }); U.$$('#setMode button').forEach(x => x.classList.toggle('on', x === b)); modeHint(); showBoot(); CX.scan.reboot(); };
  root.onclick = e => { const t = e.target.closest('.sw[data-t]'); if (!t) return; const k = t.dataset.t, v = !CX.settings.get(k); CX.settings.set({ [k]: v }); t.classList.toggle('on', v); if (k === 'wakeLock') wake(); };
  $('#applyUni').onclick = () => { showBoot(); CX.scan.reboot(); }; $('#applyApi').onclick = () => { CX.settings.set({ apiBase: $('#sApi').value.trim(), wsBase: $('#sWs').value.trim() }); showBoot(); CX.scan.reboot(); };
  $('#resetSet').onclick = () => { if (confirm('استعادة كل الإعدادات الافتراضية؟')) { CX.settings.reset(); setBuilt = false; buildSettings(); } };
  $('#askNotif').onclick = async () => { if (typeof Notification === 'undefined') return U.toast('المتصفح لا يدعم الإشعارات', 'bad'); const p = await Notification.requestPermission(); U.toast(p === 'granted' ? 'تم تفعيل الإشعارات ✔' : 'لم يُمنح الإذن', p === 'granted' ? '' : 'bad'); };
  $('#testSnd').onclick = () => CX.notify.beep('strong');
  $('#testTg').onclick = async () => { CX.settings.set({ tgOn: true }); const r = await CX.notify.telegram('✅ CIPHER X PRO — رسالة اختبار. الاتصال يعمل.'); U.toast(r.ok ? 'وصلت الرسالة ✔' : 'فشل: ' + esc(r.err), r.ok ? '' : 'bad'); buildSettings(); };
  modeHint(); U.bindOpen(root); setBuilt = true;
}
function modeHint() { const m = CX.settings.tfs(); const mh = $('#modeHint'); if (mh) mh.textContent = `محفّز ${m.trigger} · وسيط ${m.setup} · اتجاه ${m.trend}${m.htf ? ' · مرجع ' + m.htf : ''} — ${CX.settings.get('mode') === 'scalp' ? 'صفقات قصيرة، إشارات أكثر، ضوضاء أعلى' : CX.settings.get('mode') === 'swing' ? 'صفقات أطول، إشارات أقل، وقف أوسع' : 'توازن بين الجودة والتكرار (الموصى به)'}`; $('#modeBtn').textContent = `${CX.modes[CX.settings.get('mode')].label} · ${m.trigger}`; }
function diag() {
  const el = $('#diag'); if (!el) return; const a = CX.api.st, f = CX.feed.status(), sc = CX.scan.state;
  const kv = (l, v) => `<div class="kv"><span>${l}</span><span class="num">${v}</span></div>`;
  el.innerHTML = kv('REST ناجح / فاشل', `${a.ok} / ${a.fail}`) + kv('الوزن المستهلك (دقيقة)', Math.round(a.used) + ' / 2400') + kv('آخر خطأ', esc(a.lastErr || '—')) + kv('حظر مؤقت', Date.now() < a.banUntil ? U.countdown(a.banUntil - Date.now()) : 'لا') + kv('حظر جغرافي', a.geo ? 'نعم ⚠' : 'لا')
    + kv('WebSocket /market', f.market) + kv('WebSocket /public', f.public) + kv('رسائل /market', CX.feed.market.msgs) + kv('دورات المسح', sc.cycles) + kv('أخطاء المسح', sc.errors) + kv('انحراف ساعة الخادم', Math.round(a.offset) + ' ms') + kv('الإشارات المخزنة', CX.signals.all().length);
}
U.pages.settings = { show() { if (!setBuilt) buildSettings(); diag(); }, render() { if (!setBuilt) buildSettings(); diag(); } };

/* ---------- شاشة الإقلاع + الحالة ---------- */
function showBoot() { $('#boot').classList.remove('hide'); $('#bootErr').textContent = ''; $('#bootRetry').style.display = 'none'; }
let wl = null;
async function wake() { try { if (CX.settings.get('wakeLock') && 'wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } else if (!CX.settings.get('wakeLock') && wl) { await wl.release(); wl = null; } } catch (e) {} }
function header() {
  const a = CX.api.st, f = CX.feed.status(), rd = $('#stRest .dot'), wd = $('#stWs .dot');
  rd.className = 'dot ' + (a.geo ? 'bad' : Date.now() < a.banUntil ? 'warn' : a.ok ? 'ok' : '');
  wd.className = 'dot ' + (f.market === 'open' && CX.feed.healthy() ? 'ok' : f.market === 'connecting' ? 'warn' : f.market === 'closed' ? 'bad' : '');
  const sc = CX.scan.state; $('#topBar').style.width = sc.phase === 'boot' ? (sc.progress * 100) + '%' : sc.busy ? '60%' : '0';
  if (U.page === 'settings') diag();
}
function init() {
  U.buildNav(); ['signals', 'market', 'chart', 'perf'].forEach(k => U.bindOpen($('#p-' + k)));
  $('#modeBtn').onclick = () => U.go('settings');
  $('#bootRetry').onclick = () => { showBoot(); CX.scan.boot(); };
  CX.bus.on('scan-state', s => {
    $('#bootBar').style.width = (s.progress * 100) + '%'; if (s.phase === 'boot') $('#bootMsg').textContent = s.msg;
    if (s.phase === 'error') {
      $('#bootMsg').textContent = 'تعذر الاتصال بـ Binance Futures';
      $('#bootErr').innerHTML = s.geo ? 'Binance يرفض الاتصال من هذه الشبكة/الدولة (HTTP 451/403). جرّب شبكة أخرى أو VPN، أو ضع عنوان وسيط في الإعدادات ← متقدم.' : esc(s.msg) + '<br>تحقق من الإنترنت ثم أعد المحاولة.';
      $('#bootRetry').style.display = '';
    }
    header();
  });
  CX.bus.on('boot-done', () => { $('#boot').classList.add('hide'); U.go(U.page === 'settings' ? 'settings' : U.page); modeHint(); });
  CX.bus.on('ws-state', header);
  CX.bus.on('toast', t => U.toast(esc(t.title), t.kind, () => { if (t.sig) { U.go('signals'); } }));
  ['signal', 'signal-update', 'cycle', 'boot-done'].forEach(ev => CX.bus.on(ev, () => { U.invalidate('signals'); U.invalidate('market'); U.invalidate('chart'); if (U.page === 'perf') U.invalidate('perf'); }));
  CX.bus.on('prices', () => { U.invalidate('market'); });
  CX.bus.on('active', () => { U.invalidate('chart'); });
  CX.bus.on('settings', () => { U.invalidate('signals'); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); CX.feed.market.watchdog(); CX.feed.pub.watchdog(); if (CX.scan.state.phase === 'ready') { CX.scan.trackAll(); CX.scan.cycle(); } } });
  setInterval(header, 2000); modeHint();
  CX.scan.boot(); wake();
}
window.addEventListener('error', e => { try { console.error('[CX]', e.message); } catch (x) {} });
init();

})(CX);
if (typeof module !== 'undefined') module.exports = CX;

</script>
</body>
